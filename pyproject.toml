[project]
name = "confinqa"
version = "0.1.0"
description = "ConfinQA assignment data processing and assessment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer",
  "click",
  "dotenv",
  "pandas",
  "pydantic",
  "ruff",
  "mypy",
  "graphiti-core==0.29.1",
  "openai",
  "pytest",
  "pytest-asyncio",
  "chonkie>=1.6.7",
  "catsu>=0.1.8",
  "simpleeval>=1.0.7",
  "tabulate>=0.10.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
main = "src.main:app"


[tool.ruff]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "F",  # default Ruff rules
    "E",  # pycodestyle Errors
    "W",  # pycodestyle Warnings
    "I",  # import sorting
    "UP", # modern syntax updates
    "B",  # flake8 common pitfalls & best practices
    "Q",  # flake8 consistent quotes
    "N",  # naming conventions,
]

ignore = [
    "B008",
    "D413",
    "E501",
    "W293",
    "W291",
    "PLR2004",
    "D101",
    "D400",
    "UP007",  # Typer doesn't yet support `X | None` need Optional[X] for CLI Options
    "UP045",  # Same as UP007 for the `Optional[X]` form
    "UP035",  # Pair with UP007: keep `from typing import Optional` available

]

fixable = ["ALL"]

# Rules whose autofix we explicitly DO NOT want applied (even if "fix=true").
# UP007/UP006/UP035 rewrite `Optional[X]` / `Union[X, Y]` to `X | None` / `X | Y`,
# but Typer (used in src/main.py) does not yet support the new-style annotations
# for CLI Options. Keep these in the typing-style form.
unfixable = ["UP006", "UP007", "UP035", "UP045"]

extend-select = [
    "PLR2004",
    "D101",
    "D102",
    "D103",
    "D201",
    "D202",
    "D215",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings on every helper / fixture / case
"tests/**/*.py" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:graphiti_core",
]

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_globals = true
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_return_any = true
plugins = ['pydantic.mypy']
packages = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
