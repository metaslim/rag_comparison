name: CI

on:
  push:
    branches: [main, submission]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Run tests with coverage
        env:
          # Settings._require("OPENAI_API_KEY") loads at import time.
          # Tests mock all OpenAI calls, so a dummy value is sufficient.
          OPENAI_API_KEY: ci-dummy-key-tests-use-mocks
        run: uv run pytest tests/ --cov=src --cov-report=term -q
